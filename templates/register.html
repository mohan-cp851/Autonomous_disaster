<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADRACS Command - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            background-color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width:60px; height:60px;">
                    <i class="fa-solid fa-user-plus fa-2x"></i>
                </div>
                <h3 class="fw-bold text-dark m-0">Register Personnel</h3>
                <small class="text-muted">Register an ADRACS Responder Profile</small>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} py-2" role="alert" style="font-size:0.85rem;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="officer_meshram">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="name@disaster.gov.in">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label text-secondary fw-semibold">Assigned Command Role</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-shield-halved"></i></span>
                        <select class="form-select" id="role" name="role">
                            <option value="public">Public Citizen / Volunteer</option>
                            <option value="responder">Field Responder (NDRF/SDRF)</option>
                            <option value="admin">District Admin Command</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Register Profile</button>
            </form>
            
            <div class="text-center border-top pt-3">
                <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold">Authenticate here</a></small>
            </div>
        </div>
    </div>
</body>
</html>
